# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# The .xcodeproj is not committed; this file is the source of truth.
name: BetweenStops
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: $(APP_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

# Every game is a local Swift package. Add new ones here and in GameRegistry.swift.
packages:
  PlayKit:
    path: Packages/PlayKit
  KlondikeEngine:
    path: Packages/KlondikeEngine
  Solitaire:
    path: Games/Solitaire
  BubbleEngine:
    path: Packages/BubbleEngine
  Bubbles:
    path: Games/Bubbles
  ArcheryEngine:
    path: Packages/ArcheryEngine
  Archery:
    path: Games/Archery
  TestGame:
    path: Games/TestGame

targets:
  BetweenStops:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: PlayKit
      - package: Solitaire
      - package: Bubbles
      - package: Archery
      - package: TestGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  BetweenStopsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: BetweenStops
      - package: PlayKit
      - package: KlondikeEngine
      - package: Solitaire
      - package: BubbleEngine
      - package: Bubbles
      - package: ArcheryEngine
      - package: Archery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  BetweenStopsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BetweenStops
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BetweenStops:
    build:
      targets:
        BetweenStops: all
        BetweenStopsTests: [test]
        BetweenStopsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - BetweenStopsTests
        - BetweenStopsUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
